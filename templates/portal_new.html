<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT 자산 관리 시스템 - 포털</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 좌측 사이드바 */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 260px;
            background: #1f2a37;
            color: #fff;
            padding: 16px 12px;
            overflow-y: auto;
        }
        .sidebar .menu-title {
            font-weight: 700;
            margin: 8px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar .nav-link {
            color: #e6edf3;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 500;
        }
        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.12);
        }
        .sidebar .links-box {
            margin-top: 18px;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            line-height: 1.5;
        }
        /* TopBar 고정 및 본문 레이아웃 분리 */
        .topbar { position: sticky; top: 0; z-index: 1030; }
        /* 본문: 좌측 사이드바 여백 + TopBar 높이만큼 패딩 */
        .content { margin-left: 260px; padding: 24px; background: var(--bg-surface); }
        /* 대시보드 컨테이너: 가로폭 축소 및 중앙 정렬 */
        .dashboard-container { max-width: 1160px; margin: 0 auto; }
        :root {
            --primary-gradient: linear-gradient(90deg, #5b6ee1 0%, #6d37b1 100%);
            --secondary-gradient: linear-gradient(135deg, #ff7fcf 0%, #ff5b84 100%);
            --success-gradient: linear-gradient(135deg, #3cc8ff 0%, #00a3ff 100%);
            --warning-gradient: linear-gradient(135deg, #ffb872 0%, #ff8f4c 100%);
            --info-gradient: linear-gradient(135deg, #64e3c7 0%, #2bc0a4 100%);
            --dark-gradient: linear-gradient(135deg, #c6d6ff 0%, #e9d3ff 100%);
            --bg-surface: #f5f7fb;
            --card-shadow: 0 8px 20px rgba(44, 62, 80, .12);
        }

        .dashboard-card {
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }
        
        .dashboard-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .dashboard-card:hover::before {
            left: 100%;
        }
        
        .dashboard-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        .dashboard-card.type-hw { background: var(--primary-gradient); }
        .dashboard-card.type-sw { background: var(--secondary-gradient); }
        .dashboard-card.type-storage { background: var(--success-gradient); }
        .dashboard-card.type-network { background: var(--warning-gradient); }
        .dashboard-card.status-operating { background: var(--info-gradient); }
        .dashboard-card.status-instock { background: var(--dark-gradient); }
        .dashboard-card.status-pending { background: var(--secondary-gradient); }
        
        .dashboard-number {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .dashboard-label {
            font-size: 1.1rem;
            opacity: 0.95;
            font-weight: 500;
        }
        
        .chart-container {
            background: white;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        /* 차트 깨짐 방지: 컨테이너 폭에 맞춰 캔버스 자동 리사이즈 */
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        
        .breadcrumb-item + .breadcrumb-item::before {
            content: ">";
            color: #6c757d;
        }
        
        .status-badge {
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
        }
        
        .type-badge {
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
        }

        /* (원복) 세로 라벨 제거 */
        
        .search-container {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        
        .table-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .table th {
            background: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            font-weight: 600;
            padding: 1rem;
        }
        
        .action-btn {
            margin: 0 0.2rem;
            border-radius: 20px;
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 2rem;
        }
        
        .alert-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
        }
        
        .recent-assets {
            background: white;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .expiry-alert {
            background: linear-gradient(135deg, #ffe1a6 0%, #ffd1b8 100%);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            color: #721c24;
        }
        
        .modal-content {
            border-radius: 20px;
            border: none;
        }
        
        .modal-header {
            background: var(--primary-gradient);
            color: white;
            border-radius: 20px 20px 0 0;
        }
        
        .btn-close {
            filter: invert(1);
        }
        
        @media (max-width: 1200px) {
            .dashboard-container { max-width: 980px; }
        }

        @media (max-width: 992px) {
            .content { margin-left: 0; padding-top: 72px; }
            .sidebar { position: fixed; transform: translateX(-100%); transition: transform .3s ease; }
            .sidebar.show { transform: translateX(0); }
        }

        @media (max-width: 768px) {
            .dashboard-number {
                font-size: 2rem;
            }
            
            .dashboard-label {
                font-size: 0.9rem;
            }
            
            .chart-container {
                padding: 1rem;
            }
            
            .search-container {
                padding: 1rem;
            }
            .dashboard-container { max-width: 100%; }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-light">
    <!-- 알림 컨테이너 -->
    <div class="alert-container" id="alertContainer"></div>

    <!-- 좌측 사이드바 -->
    <aside class="sidebar">
        <div class="menu-title"><i class="fas fa-layer-group"></i> IT 포털</div>
        <div class="list-group list-group-flush mb-3">
            <a class="list-group-item bg-transparent border-0 nav-link" href="#" onclick="showPortalDashboard()">대시보드</a>
            <a class="list-group-item bg-transparent border-0 nav-link" href="#" onclick="showAssetsList()">자산현황</a>
            <!-- 불필요 메뉴 제거 (이미지 지시) -->
        </div>
    </aside>

    <!-- 헤더 (Top 바) -->
    <nav class="navbar navbar-expand-lg navbar-dark topbar" style="background: var(--primary-gradient);">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-server me-2"></i>
                IT 자산 관리 시스템
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text">
                    <i class="fas fa-user me-1"></i>
                    관리자
                </span>
            </div>
        </div>
    </nav>

    <!-- 본문 영역 (사이드바와 분리, 대시보드 폭 제한) -->
    <div class="content">
        <div class="dashboard-container">
        <!-- 페이지 제목 -->
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="display-4 fw-bold text-primary">IT 자산 관리 시스템</h1>
                <p class="lead text-muted">PostgreSQL 기반 웹 애플리케이션</p>
            </div>
        </div>

        <!-- 포털 대시보드 섹션 -->
        <div class="row mb-5" id="dashboardSection">
            <div class="col-12">
                <!-- 대시보드 상단: 좌측 총자산 카드 + 우측 영역(유형/상태) + 새로고침 버튼 -->
                <div class="row g-4 mb-4 align-items-stretch">
                    <!-- 총자산 큰 카드 -->
                    <div class="col-lg-2 col-md-3 col-sm-12">
                        <div class="card h-100" style="background: linear-gradient(180deg,#2f7d32 0%, #1b5e20 100%); color:#fff; border:none; border-radius:20px; box-shadow: var(--card-shadow);">
                            <div class="card-body d-flex flex-column justify-content-center text-center" style="min-height: 260px;">
                                <div style="font-size:4rem; font-weight:800; line-height:1;" id="total-asset-left">0</div>
                                <div class="mt-3" style="font-size:1.2rem; letter-spacing:1px;">총자산</div>
                            </div>
                        </div>
                    </div>

                    <!-- 우측 영역: 새로고침 버튼 + 유형/상태 카드 -->
                    <div class="col-lg-10 col-md-9 col-sm-12">
                        <div class="d-flex justify-content-end mb-3">
                            <button class="btn btn-outline-light text-dark" style="background: #fff;" id="dashRefreshBtn">
                                <i class="fas fa-rotate-right me-1"></i> 새로고침
                            </button>
                        </div>

                        <!-- 유형별 자산수량 -->
                        <div class="row g-4 mb-4">
                    
                    <div class="col-lg-2 col-md-4 col-sm-6 col-6">
                        <div class="card dashboard-card type-hw h-100" onclick="showAssetsByType('HW')">
                            <div class="card-body text-center">
                                <div class="dashboard-number" id="hardware-count">0</div>
                                <div class="dashboard-label">하드웨어</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-2 col-md-4 col-sm-6 col-6">
                        <div class="card dashboard-card type-sw h-100" onclick="showAssetsByType('SW')">
                            <div class="card-body text-center">
                                <div class="dashboard-number" id="software-count">0</div>
                                <div class="dashboard-label">소프트웨어</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-2 col-md-4 col-sm-6 col-6">
                        <div class="card dashboard-card type-storage h-100" onclick="showAssetsByType('STORAGE')">
                            <div class="card-body text-center">
                                <div class="dashboard-number" id="storage-count">0</div>
                                <div class="dashboard-label">스토리지</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-2 col-md-4 col-sm-6 col-6">
                        <div class="card dashboard-card type-network h-100" onclick="showAssetsByType('NW')">
                            <div class="card-body text-center">
                                <div class="dashboard-number" id="network-count">0</div>
                                <div class="dashboard-label">네트워크</div>
                            </div>
                        </div>
                        </div>

                        <!-- 상태별 수량 + 우측 새로고침 -->
                        <div class="d-flex justify-content-end mb-2">
                            <button class="btn btn-outline-light text-dark" style="background:#fff;" id="dashRefreshBtn2">
                                <i class="fas fa-rotate-right me-1"></i> 새로고침
                            </button>
                        </div>
                        <div class="row g-4 mb-4">
                    <div class="col-lg-4 col-md-4 col-sm-6 col-6">
                        <div class="card dashboard-card status-operating h-100" onclick="showAssetsByStatus('운영')">
                            <div class="card-body text-center">
                                <div class="dashboard-number" id="operating-count">0</div>
                                <div class="dashboard-label">운영 중</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-4 col-md-4 col-sm-6 col-6">
                        <div class="card dashboard-card status-instock h-100" onclick="showAssetsByStatus('입고')">
                            <div class="card-body text-center">
                                <div class="dashboard-number" id="instock-count">0</div>
                                <div class="dashboard-label">입고</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-4 col-md-4 col-sm-6 col-6">
                        <div class="card dashboard-card status-pending h-100" onclick="showAssetsByStatus('대기')">
                            <div class="card-body text-center">
                                <div class="dashboard-number" id="pending-count">0</div>
                                <div class="dashboard-label">대기</div>
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
                
                <!-- 차트 시각화 -->
                <div class="row">
                    <div class="col-lg-6">
                        <div class="chart-container" style="height: 280px;">
                            <h5 class="mb-3"><i class="fas fa-chart-pie me-2"></i>유형별 자산 분포</h5>
                            <canvas id="typeChart"></canvas>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="chart-container" style="height: 280px;">
                            <h5 class="mb-3"><i class="fas fa-chart-bar me-2"></i>상태별 자산 현황</h5>
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 최근 추가된 자산 목록 -->
        <div class="row mb-4 dashboard-container" id="recentSection">
            <div class="col-12">
                <div class="recent-assets">
                    <h5 class="mb-3"><i class="fas fa-clock me-2"></i>최근 추가된 자산</h5>
                    <div id="recentAssetsList" class="row g-3">
                        <!-- 최근 자산이 여기에 동적으로 로드됩니다 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 보증 만료 예정 자산 알림 -->
        <div class="row mb-4 dashboard-container" id="expirySection">
            <div class="col-12">
                <div class="expiry-alert" id="expiryAlert" style="display: none;">
                    <h5 class="mb-3"><i class="fas fa-exclamation-triangle me-2"></i>보증 만료 예정 자산</h5>
                    <div id="expiryAssetsList">
                        <!-- 만료 예정 자산이 여기에 표시됩니다 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 공지사항 / 자료실 -->
        <div class="row g-4 mb-4">
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <strong><i class="fas fa-bullhorn me-2"></i>공지사항</strong>
                        <button class="btn btn-sm btn-outline-primary" onclick="openBoardModal('notice')"><i class="fas fa-plus"></i></button>
                    </div>
                    <ul class="list-group list-group-flush" id="noticeList">
                        <!-- 공지 목록 -->
                    </ul>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <strong><i class="fas fa-folder-open me-2"></i>자료실</strong>
                        <button class="btn btn-sm btn-outline-primary" onclick="openBoardModal('resource')"><i class="fas fa-plus"></i></button>
                    </div>
                    <ul class="list-group list-group-flush" id="resourceList">
                        <!-- 자료실 목록 -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- 자산현황 목록 섹션 -->
        <div class="row dashboard-container" id="listSection" style="display: none;">
            <div class="col-12">
                <!-- 브레드크럼 네비게이션 -->
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a href="#" class="text-decoration-none" onclick="showPortalDashboard()">
                                <i class="fas fa-home me-1"></i>
                                Home
                            </a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page">자산현황 목록</li>
                    </ol>
                </nav>

                <!-- 검색 및 필터링 영역 -->
                <div class="search-container">
                    <div class="row align-items-center">
                        <div class="col-md-6">
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-search"></i>
                                </span>
                                <input type="text" class="form-control" id="searchInput" placeholder="자산 검색...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="searchField">
                                <option value="all">전체 검색</option>
                                <option value="Type">유형</option>
                                <option value="Model">모델</option>
                                <option value="Location">위치</option>
                                <option value="Status">상태</option>
                            </select>
                        </div>
                        <div class="col-md-3 text-end">
                            <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#addAssetModal">
                                <i class="fas fa-plus me-1"></i>
                                자산 추가
                            </button>
                            <button class="btn btn-primary me-2" onclick="exportCSV()">
                                <i class="fas fa-download me-1"></i>
                                CSV 내보내기
                            </button>
                            <button class="btn btn-secondary" onclick="refreshData()">
                                <i class="fas fa-sync-alt me-1"></i>
                                새로고침
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 로딩 스피너 -->
                <div class="loading-spinner" id="loadingSpinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">로딩 중...</span>
                    </div>
                    <p class="mt-2">데이터를 불러오는 중...</p>
                </div>

                <!-- 자산 목록 테이블 -->
                <div class="table-container" id="tableContainer" style="display: none;">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>유형</th>
                                    <th>모델</th>
                                    <th>구매일</th>
                                    <th>보증기간</th>
                                    <th>상태</th>
                                    <th>위치</th>
                                    <th>비고</th>
                                    <th>작업</th>
                                </tr>
                            </thead>
                            <tbody id="assetsTableBody">
                                <!-- 자산 데이터가 여기에 동적으로 로드됩니다 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 자산 추가/수정 모달 -->
    <div class="modal fade" id="addAssetModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">자산 추가</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="assetForm">
                        <input type="hidden" id="assetId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="assetType" class="form-label">유형</label>
                                <select class="form-select" id="assetType" required>
                                    <option value="">선택하세요</option>
                                    <option value="HW">하드웨어 (HW)</option>
                                    <option value="SW">소프트웨어 (SW)</option>
                                    <option value="NW">네트워크 (NW)</option>
                                    <option value="STORAGE">저장장치 (STORAGE)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="assetModel" class="form-label">모델</label>
                                <input type="text" class="form-control" id="assetModel" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="purchaseDate" class="form-label">구매일</label>
                                <input type="date" class="form-control" id="purchaseDate" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="warranty" class="form-label">보증기간</label>
                                <select class="form-select" id="warranty" required>
                                    <option value="">선택하세요</option>
                                    <option value="1년">1년</option>
                                    <option value="3년">3년</option>
                                    <option value="5년">5년</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="assetStatus" class="form-label">상태</label>
                                <select class="form-select" id="assetStatus" required>
                                    <option value="">선택하세요</option>
                                    <option value="운영">운영</option>
                                    <option value="입고">입고</option>
                                    <option value="대기">대기</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="assetLocation" class="form-label">위치</label>
                                <input type="text" class="form-control" id="assetLocation" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="assetRemarks" class="form-label">비고</label>
                            <textarea class="form-control" id="assetRemarks" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" onclick="saveAsset()">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 자산 목록 모달 -->
    <div class="modal fade" id="assetsListModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="assetsListModalTitle">자산 목록</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>유형</th>
                                    <th>모델</th>
                                    <th>구매일</th>
                                    <th>보증기간</th>
                                    <th>상태</th>
                                    <th>위치</th>
                                    <th>비고</th>
                                </tr>
                            </thead>
                            <tbody id="modalAssetsTableBody">
                                <!-- 모달 내 자산 목록이 여기에 표시됩니다 -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 공지/자료 등록 모달 -->
    <div class="modal fade" id="boardModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="boardModalTitle">항목 추가</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">제목</label>
                        <input type="text" class="form-control" id="boardTitle">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL (선택)</label>
                        <input type="url" class="form-control" id="boardUrl" placeholder="https://...">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" onclick="saveBoardItem()">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let typeChart, statusChart;
        let allAssets = {};
        let currentView = 'dashboard';

        // 페이지 로드 시 데이터 초기화
        document.addEventListener('DOMContentLoaded', function() {
            showPortalDashboard();
            renderBoards();
            const refresh1 = document.getElementById('dashRefreshBtn');
            const refresh2 = document.getElementById('dashRefreshBtn2');
            if (refresh1) refresh1.addEventListener('click', () => loadDashboardData());
            if (refresh2) refresh2.addEventListener('click', () => loadDashboardData());
        });

        // 포털 대시보드 표시
        function showPortalDashboard() {
            currentView = 'dashboard';
            document.querySelector('.breadcrumb-item.active').textContent = '포털 대시보드';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('recentSection').style.display = 'block';
            document.getElementById('expirySection').style.display = 'block';
            document.getElementById('listSection').style.display = 'none';
            loadDashboardData();
        }

        // ===== 공지/자료실 =====
        const STORAGE_KEYS = {
            notice: 'it_asset_portal_notices',
            resource: 'it_asset_portal_resources'
        };
        let currentBoardType = 'notice';

        function getBoardItems(type){
            try { return JSON.parse(localStorage.getItem(STORAGE_KEYS[type]) || '[]'); } catch { return []; }
        }
        function setBoardItems(type, items){
            localStorage.setItem(STORAGE_KEYS[type], JSON.stringify(items));
        }
        function renderBoards(){
            renderBoard('notice', 'noticeList');
            renderBoard('resource', 'resourceList');
        }
        function renderBoard(type, listId){
            const list = document.getElementById(listId);
            const items = getBoardItems(type);
            list.innerHTML = '';
            if(items.length === 0){
                const li = document.createElement('li');
                li.className = 'list-group-item text-muted';
                li.textContent = '등록된 항목이 없습니다.';
                list.appendChild(li);
                return;
            }
            items.slice().reverse().forEach((item, idx) => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                const left = document.createElement('div');
                left.innerHTML = `<span class="me-2">${item.title}</span><small class="text-muted">${item.date}</small>`;
                if(item.url){ left.innerHTML = `<a href="${item.url}" target="_blank" class="me-2 text-decoration-none">${item.title}</a><small class="text-muted">${item.date}</small>`; }
                const del = document.createElement('button');
                del.className = 'btn btn-sm btn-outline-danger';
                del.innerHTML = '<i class="fas fa-trash"></i>';
                del.onclick = () => { deleteBoardItem(type, items.length-1-idx); };
                li.appendChild(left);
                li.appendChild(del);
                list.appendChild(li);
            });
        }
        function openBoardModal(type){
            currentBoardType = type;
            document.getElementById('boardTitle').value = '';
            document.getElementById('boardUrl').value = '';
            document.getElementById('boardModalTitle').textContent = (type==='notice'?'공지사항':'자료실') + ' 추가';
            new bootstrap.Modal(document.getElementById('boardModal')).show();
        }
        function saveBoardItem(){
            const title = document.getElementById('boardTitle').value.trim();
            const url = document.getElementById('boardUrl').value.trim();
            if(!title){ showAlert('제목을 입력하세요.', 'warning'); return; }
            const items = getBoardItems(currentBoardType);
            items.push({ title, url, date: new Date().toLocaleDateString('ko-KR') });
            setBoardItems(currentBoardType, items);
            renderBoards();
            bootstrap.Modal.getInstance(document.getElementById('boardModal')).hide();
            showAlert('저장되었습니다.', 'success');
        }
        function deleteBoardItem(type, index){
            const items = getBoardItems(type);
            items.splice(index,1);
            setBoardItems(type, items);
            renderBoards();
        }

        // 자산현황 목록 표시
        function showAssetsList() {
            currentView = 'list';
            document.querySelector('.breadcrumb-item.active').textContent = '자산현황 목록';
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('recentSection').style.display = 'none';
            document.getElementById('expirySection').style.display = 'none';
            document.getElementById('listSection').style.display = 'block';
            loadAssets();
        }

        // 대시보드 데이터 로드
        async function loadDashboardData() {
            showLoading(true);
            try {
                const [assetsResponse, statsResponse] = await Promise.all([
                    fetch('/api/assets'),
                    fetch('/api/statistics')
                ]);
                
                if (assetsResponse.ok && statsResponse.ok) {
                    allAssets = await assetsResponse.json();
                    const stats = await statsResponse.json();
                    
                    updateDashboard(stats);
                    updateCharts(stats);
                    loadRecentAssets();
                    loadExpiryAlerts();
                } else {
                    showAlert('데이터를 불러올 수 없습니다.', 'danger');
                }
            } catch (error) {
                console.error('대시보드 로드 오류:', error);
                showAlert('데이터 로드 중 오류가 발생했습니다.', 'danger');
            } finally {
                showLoading(false);
            }
        }

        // 대시보드 업데이트
        function updateDashboard(stats) {
            const total = stats.total_assets || 0;
            document.getElementById('total-assets').textContent = total;
            const left = document.getElementById('total-asset-left');
            if (left) left.textContent = total;
            document.getElementById('hardware-count').textContent = stats.hardware || 0;
            document.getElementById('software-count').textContent = stats.software || 0;
            document.getElementById('storage-count').textContent = stats.storage || 0;
            document.getElementById('network-count').textContent = stats.network || 0;
            document.getElementById('operating-count').textContent = stats.operating || 0;
            document.getElementById('instock-count').textContent = stats.in_stock || 0;
            document.getElementById('pending-count').textContent = stats.waiting || 0;
        }

        // 차트 업데이트
        function updateCharts(stats) {
            // 유형별 차트
            const typeCtx = document.getElementById('typeChart').getContext('2d');
            if (typeChart) {
                typeChart.destroy();
                typeChart = null;
            }
            
            // 차트 인스턴스 재생성 시 애니메이션/이벤트 최소화로 화면깨짐 방지
            typeChart = new Chart(typeCtx, {
                type: 'doughnut',
                data: {
                    labels: ['하드웨어', '소프트웨어', '스토리지', '네트워크'],
                    datasets: [{
                        data: [stats.hardware || 0, stats.software || 0, stats.storage || 0, stats.network || 0],
                        backgroundColor: ['#667eea', '#f093fb', '#4facfe', '#43e97b'],
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { intersect: false, mode: 'nearest' },
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });

            // 상태별 차트
            const statusCtx = document.getElementById('statusChart').getContext('2d');
            if (statusChart) {
                statusChart.destroy();
                statusChart = null;
            }
            
            statusChart = new Chart(statusCtx, {
                type: 'bar',
                data: {
                    labels: ['운영 중', '입고', '대기'],
                    datasets: [{
                        label: '자산 수',
                        data: [stats.operating || 0, stats.in_stock || 0, stats.waiting || 0],
                        backgroundColor: ['#fa709a', '#fee140', '#a8edea'],
                        borderWidth: 1,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { intersect: false, mode: 'nearest' },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { display: false },
                            ticks: { stepSize: 1, precision: 0 }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        // 최근 추가된 자산 로드
        function loadRecentAssets() {
            const recentAssets = Object.entries(allAssets)
                .sort((a, b) => new Date(b[1]['Purchase Date'] || 0) - new Date(a[1]['Purchase Date'] || 0))
                .slice(0, 4);

            const container = document.getElementById('recentAssetsList');
            container.innerHTML = '';

            recentAssets.forEach(([id, asset]) => {
                const col = document.createElement('div');
                col.className = 'col-lg-3 col-md-6 col-sm-6 col-12';
                col.innerHTML = `
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body text-center">
                            <div class="mb-2">
                                <span class="badge ${getTypeBadgeClass(asset.Type)}">${asset.Type}</span>
                            </div>
                            <h6 class="card-title">${asset.Model}</h6>
                            <p class="card-text small text-muted">
                                <i class="fas fa-map-marker-alt me-1"></i>${asset.Location}<br>
                                <i class="fas fa-calendar me-1"></i>${formatDate(asset['Purchase Date'])}
                            </p>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        // 보증 만료 예정 자산 알림
        function loadExpiryAlerts() {
            const now = new Date();
            const expiryAssets = Object.entries(allAssets).filter(([id, asset]) => {
                if (!asset['Purchase Date'] || !asset.Warranty) return false;
                
                const purchaseDate = new Date(asset['Purchase Date']);
                const warrantyYears = parseInt(asset.Warranty);
                const expiryDate = new Date(purchaseDate.getFullYear() + warrantyYears, purchaseDate.getMonth(), purchaseDate.getDate());
                
                const daysUntilExpiry = Math.ceil((expiryDate - now) / (1000 * 60 * 60 * 24));
                return daysUntilExpiry <= 90 && daysUntilExpiry > 0;
            });

            const container = document.getElementById('expiryAssetsList');
            const alertDiv = document.getElementById('expiryAlert');

            if (expiryAssets.length > 0) {
                container.innerHTML = '';
                expiryAssets.forEach(([id, asset]) => {
                    const purchaseDate = new Date(asset['Purchase Date']);
                    const warrantyYears = parseInt(asset.Warranty);
                    const expiryDate = new Date(purchaseDate.getFullYear() + warrantyYears, purchaseDate.getMonth(), purchaseDate.getDate());
                    const daysUntilExpiry = Math.ceil((expiryDate - now) / (1000 * 60 * 60 * 24));

                    const alertItem = document.createElement('div');
                    alertItem.className = 'alert alert-warning mb-2';
                    alertItem.innerHTML = `
                        <strong>${asset.Model}</strong> (${asset.Type}) - 
                        보증 만료까지 <strong>${daysUntilExpiry}일</strong> 남음
                    `;
                    container.appendChild(alertItem);
                });
                alertDiv.style.display = 'block';
            } else {
                alertDiv.style.display = 'none';
            }
        }

        // 유형별 자산 목록 모달 표시
        function showAssetsByType(type) {
            let filteredAssets = {};
            let title = '';

            if (type === 'total') {
                filteredAssets = allAssets;
                title = '전체 자산 목록';
            } else {
                filteredAssets = Object.fromEntries(
                    Object.entries(allAssets).filter(([id, asset]) => asset.Type === type)
                );
                title = `${getTypeLabel(type)} 자산 목록`;
            }

            showAssetsListModal(title, filteredAssets);
        }

        // 상태별 자산 목록 모달 표시
        function showAssetsByStatus(status) {
            const filteredAssets = Object.fromEntries(
                Object.entries(allAssets).filter(([id, asset]) => asset.Status === status)
            );
            showAssetsListModal(`${status} 상태 자산 목록`, filteredAssets);
        }

        // 자산 목록 모달 표시
        function showAssetsListModal(title, assets) {
            document.getElementById('assetsListModalTitle').textContent = title;
            const tbody = document.getElementById('modalAssetsTableBody');
            tbody.innerHTML = '';

            Object.entries(assets).forEach(([id, asset]) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${id}</td>
                    <td><span class="badge ${getTypeBadgeClass(asset.Type)}">${asset.Type}</span></td>
                    <td>${asset.Model || ''}</td>
                    <td>${formatDate(asset['Purchase Date'])}</td>
                    <td>${asset.Warranty || ''}</td>
                    <td><span class="badge ${getStatusBadgeClass(asset.Status)}">${asset.Status || ''}</span></td>
                    <td>${asset.Location || ''}</td>
                    <td>${asset.Reason || ''}</td>
                `;
                tbody.appendChild(row);
            });

            new bootstrap.Modal(document.getElementById('assetsListModal')).show();
        }

        // 유형별 배지 색상 결정
        function getTypeBadgeClass(type) {
            switch(type) {
                case 'HW': return 'bg-primary';
                case 'SW': return 'bg-secondary';
                case 'STORAGE': return 'bg-success';
                case 'NW': return 'bg-warning';
                default: return 'bg-secondary';
            }
        }

        // 상태별 배지 색상 결정
        function getStatusBadgeClass(status) {
            switch(status) {
                case '운영': return 'bg-success';
                case '입고': return 'bg-warning';
                case '대기': return 'bg-info';
                case '유휴': return 'bg-secondary';
                case '폐기': return 'bg-danger';
                default: return 'bg-secondary';
            }
        }

        // 유형 라벨 가져오기
        function getTypeLabel(type) {
            switch(type) {
                case 'HW': return '하드웨어';
                case 'SW': return '소프트웨어';
                case 'STORAGE': return '스토리지';
                case 'NW': return '네트워크';
                default: return type;
            }
        }

        // 날짜 포맷팅
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('ko-KR', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // 로딩 상태 표시/숨김
        function showLoading(show) {
            document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
            if (currentView === 'list') {
                document.getElementById('tableContainer').style.display = show ? 'none' : 'block';
            }
        }

        // 알림 표시
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            alertContainer.appendChild(alertDiv);
            
            // 5초 후 자동 제거
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 5000);
        }

        // 자산 목록 로드
        async function loadAssets() {
            showLoading(true);
            try {
                const response = await fetch('/api/assets');
                if (response.ok) {
                    allAssets = await response.json();
                    displayAssets(allAssets);
                } else {
                    showAlert('자산 목록을 불러올 수 없습니다.', 'danger');
                }
            } catch (error) {
                console.error('자산 로드 오류:', error);
                showAlert('자산 목록 로드 중 오류가 발생했습니다.', 'danger');
            } finally {
                showLoading(false);
            }
        }

        // 자산 목록 표시
        function displayAssets(assets) {
            const tbody = document.getElementById('assetsTableBody');
            tbody.innerHTML = '';

            Object.entries(assets).forEach(([id, asset]) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${id}</td>
                    <td><span class="badge ${getTypeBadgeClass(asset.Type)} type-badge">${asset.Type || ''}</span></td>
                    <td>${asset.Model || ''}</td>
                    <td>${formatDate(asset['Purchase Date'])}</td>
                    <td>${asset.Warranty || ''}</td>
                    <td><span class="badge ${getStatusBadgeClass(asset.Status)} status-badge">${asset.Status || ''}</span></td>
                    <td>${asset.Location || ''}</td>
                    <td>${asset.Reason || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary action-btn" onclick="editAsset(${id})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger action-btn" onclick="deleteAsset(${id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 자산 검색
        document.getElementById('searchInput').addEventListener('input', function() {
            const searchTerm = this.value;
            const searchField = document.getElementById('searchField').value;
            searchAssets(searchTerm, searchField);
        });

        async function searchAssets(searchTerm, field) {
            try {
                const url = `/api/search?q=${encodeURIComponent(searchTerm)}&field=${field}`;
                const response = await fetch(url);
                const assets = await response.json();
                displayAssets(assets);
            } catch (error) {
                console.error('검색 오류:', error);
                showAlert('검색 중 오류가 발생했습니다.', 'danger');
            }
        }

        // 자산 추가/수정
        function editAsset(id) {
            loadAssetForEdit(id);
        }

        async function loadAssetForEdit(id) {
            try {
                const response = await fetch(`/api/assets/${id}`);
                const asset = await response.json();
                
                document.getElementById('assetId').value = id;
                document.getElementById('assetType').value = asset.Type || '';
                document.getElementById('assetModel').value = asset.Model || '';
                document.getElementById('purchaseDate').value = asset['Purchase Date'] || '';
                document.getElementById('warranty').value = asset.Warranty || '';
                document.getElementById('assetStatus').value = asset.Status || '';
                document.getElementById('assetLocation').value = asset.Location || '';
                document.getElementById('assetRemarks').value = asset.Reason || '';
                
                document.getElementById('modalTitle').textContent = '자산 수정';
                new bootstrap.Modal(document.getElementById('addAssetModal')).show();
            } catch (error) {
                console.error('자산 로드 오류:', error);
                showAlert('자산 정보를 불러올 수 없습니다.', 'danger');
            }
        }

        // 자산 저장
        async function saveAsset() {
            const assetId = document.getElementById('assetId').value;
            const assetData = {
                Type: document.getElementById('assetType').value,
                Model: document.getElementById('assetModel').value,
                'Purchase Date': document.getElementById('purchaseDate').value,
                Warranty: document.getElementById('warranty').value,
                Status: document.getElementById('assetStatus').value,
                Location: document.getElementById('assetLocation').value,
                Reason: document.getElementById('assetRemarks').value
            };

            try {
                const url = assetId ? `/api/assets/${assetId}` : '/api/assets';
                const method = assetId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(assetData)
                });

                if (response.ok) {
                    const result = await response.json();
                    showAlert(result.message || '자산이 성공적으로 저장되었습니다.', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('addAssetModal')).hide();
                    
                    if (currentView === 'dashboard') {
                        loadDashboardData();
                    } else {
                        loadAssets();
                    }
                    resetForm();
                } else {
                    const error = await response.json();
                    showAlert('오류: ' + error.error, 'danger');
                }
            } catch (error) {
                console.error('저장 오류:', error);
                showAlert('저장 중 오류가 발생했습니다.', 'danger');
            }
        }

        // 자산 삭제
        async function deleteAsset(id) {
            if (confirm('정말로 이 자산을 삭제하시겠습니까?')) {
                try {
                    const response = await fetch(`/api/assets/${id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        showAlert('자산이 성공적으로 삭제되었습니다.', 'success');
                        if (currentView === 'dashboard') {
                            loadDashboardData();
                        } else {
                            loadAssets();
                        }
                    } else {
                        const error = await response.json();
                        showAlert('오류: ' + error.error, 'danger');
                    }
                } catch (error) {
                    console.error('삭제 오류:', error);
                    showAlert('삭제 중 오류가 발생했습니다.', 'danger');
                }
            }
        }

        // 폼 초기화
        function resetForm() {
            document.getElementById('assetForm').reset();
            document.getElementById('assetId').value = '';
            document.getElementById('modalTitle').textContent = '자산 추가';
        }

        // CSV 내보내기
        function exportCSV() {
            window.location.href = '/export/csv';
        }

        // 데이터 새로고침
        function refreshData() {
            if (currentView === 'dashboard') {
                loadDashboardData();
            } else {
                loadAssets();
            }
        }

        // 모달이 닫힐 때 폼 초기화
        document.getElementById('addAssetModal').addEventListener('hidden.bs.modal', function() {
            resetForm();
        });

        // 브레드크럼 Home 클릭 시 대시보드로 이동
        document.querySelector('.breadcrumb-item a').addEventListener('click', function(e) {
            e.preventDefault();
            showPortalDashboard();
        });
    </script>
</body>
</html>
